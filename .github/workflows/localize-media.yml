name: Localize brand media
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/localize-media.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python scripts/import-media.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets catalog.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Localize original product media as WebP"
            git push
          fi
